game:
  type: "cards_match"
  name: "התאמת כרטיסים"
  description: "התאם בין מילה לתרגום המתאים לה"
  showTimer: true
  direction: "rtl"
  categories:
    animals:
      name: "חיות"
      enabled: true
    colors:
      name: "צבעים"
      enabled: true
    numbers:
      name: "מספרים"
      enabled: true
  exerciseCount: 10
  grid:
    rows: 5
    cols: 6
  scoring:
    trackTime: true
    trackAccuracy: false
  # Pairs are shown as two columns of four cards each (4 pairs per round)
  pairs:
    # Example set for animals
    - left: "dog"
      right: "כלב"
      category: "animals"
    - left: "cat"
      right: "חתול"
      category: "animals"
    - left: "horse"
      right: "סוס"
      category: "animals"
    - left: "cow"
      right: "פרה"
      category: "animals"
    - left: "bird"
      right: "ציפור"
      category: "animals"
    - left: "fish"
      right: "דג"
      category: "animals"
    # Example set for colors
    - left: "red"
      right: "אדום"
      category: "colors"
    - left: "blue"
      right: "כחול"
      category: "colors"
    - left: "green"
      right: "ירוק"
      category: "colors"
    - left: "yellow"
      right: "צהוב"
      category: "colors"
    # Example set for numbers
    - left: "one"
      right: "אחד"
      category: "numbers"
    - left: "two"
      right: "שתיים"
      category: "numbers"
    - left: "three"
      right: "שלוש"
      category: "numbers"
    - left: "four"
      right: "ארבע"
      category: "numbers"
